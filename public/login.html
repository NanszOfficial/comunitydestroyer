<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Owner Login — Destroyer Community</title>
  <meta name="description" content="Login owner Destroyer Community." />

  <link rel="icon" href="/public/img/favicon.ico" />
  <link rel="stylesheet" href="/public/css/style.css" />
  <link rel="stylesheet" href="/public/css/animations.css" />
</head>
<body class="page-auth">

  <!-- ============ NAVBAR ============ -->
  <nav>
    <a href="/" class="nav-logo">
      <img src="/public/img/logo.png" alt="Destroyer" />
      <span class="nav-title">DESTROYER</span>
    </a>

    <button class="nav-toggle" aria-label="Menu">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="3" y1="6" x2="21" y2="6"/>
        <line x1="3" y1="12" x2="21" y2="12"/>
        <line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>

    <ul class="nav-links">
      <li><a href="/public/index.html">Home</a></li>
      <li><a href="/public/about.html">About</a></li>
      <li><a href="/public/community.html">Community</a></li>
      <li><a href="/public/gallery.html">Gallery</a></li>
      <li><a href="/public/feedback.html">Feedback</a></li>
      <li><a href="/public/login.html" class="nav-login active">Admin</a></li>
    </ul>
  </nav>

  <!-- ============ AUTH SECTION ============ -->
  <section class="auth-section">
    <div class="auth-bg"></div>

    <div class="auth-box">
      <div class="auth-head">
        <img src="/public/img/logo.png" alt="Destroyer" class="auth-logo" />
        <h1>Login Owner</h1>
        <p>Khusus owner Destroyer Community.</p>
      </div>

      <!-- ============ FORM LOGIN ============ -->
      <form id="loginForm" class="auth-form">
        <div class="form-group">
          <label for="username">Username</label>
          <input
            id="username"
            type="text"
            placeholder="Username admin"
            autocomplete="username"
            required
          />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-password">
            <input
              id="password"
              type="password"
              placeholder="Password admin"
              autocomplete="current-password"
              required
            />
            <button type="button" class="toggle-pass" id="togglePass" aria-label="Lihat password">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-full" id="loginBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:middle;margin-right:6px;">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          Login Owner
        </button>

        <p class="auth-error" id="authError" style="display:none;"></p>
      </form>

      <!-- ============ INFO ============ -->
      <div class="auth-divider">
        <span>buat user biasa</span>
      </div>

      <div class="auth-alt">
        <p>Gak perlu login. Langsung aja.</p>
        <a href="/" class="btn btn-outline btn-full">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:middle;margin-right:6px;">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
          Balik ke Home
        </a>
      </div>

      <p class="auth-hint">
        *User biasa otomatis terdaftar via IP. Gak ada login/logout.
      </p>
    </div>
  </section>

  <!-- ============ FOOTER ============ -->
  <footer>
    <div class="footer-bottom">
      <p>© <span class="year"></span> Destroyer Community — Made with 
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="vertical-align:middle;color:#ff4444;">
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
      </p>
    </div>
  </footer>

  <!-- ============ SCRIPTS ============ -->
  <script src="/public/js/config.js"></script>
  <script src="/public/js/main.js"></script>
  <script src="/public/js/api.js"></script>
  <script src="/public/js/auth.js"></script>

</body>
</html>
