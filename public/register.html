<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — Destroyer Community</title>
  <meta name="description" content="Daftar akun Destroyer Community." />

  <link rel="icon" href="/public/img/favicon.ico" />
  <link rel="stylesheet" href="/public/css/style.css" />
  <link rel="stylesheet" href="/public/css/animations.css" />
</head>
<body class="page-auth">

  <section class="auth-section">
    <div class="auth-bg"></div>

    <div class="auth-box">
      <div class="auth-head">
        <img src="/public/img/logo.png" alt="Destroyer" class="auth-logo" />
        <h1>Daftar Squad</h1>
        <p>Isi data kamu. Sekali doang, gak perlu login lagi.</p>
      </div>

      <form id="registerForm" class="auth-form">
        <div class="form-group">
          <label for="username">Username</label>
          <input
            id="username"
            type="text"
            placeholder="username_unik"
            autocomplete="off"
            maxlength="20"
            required
          />
          <p class="hint">Gak bisa diganti nanti.</p>
        </div>

        <div class="form-group">
          <label for="gamerTag">Gamer Tag</label>
          <input
            id="gamerTag"
            type="text"
            placeholder="Nama tampilan kamu"
            autocomplete="off"
            maxlength="20"
            required
          />
        </div>

        <div class="form-group">
          <label for="games">Game Favorit</label>
          <div class="checkbox-group">
            <label class="checkbox">
              <input type="checkbox" value="Any Game" class="game-check" />
              <span>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:middle;margin-right:4px;">
                  <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                  <line x1="9" y1="9" x2="9.01" y2="9"/>
                  <line x1="15" y1="9" x2="15.01" y2="9"/>
                  <line x1="9" y1="15" x2="9.01" y2="15"/>
                  <line x1="15" y1="15" x2="15.01" y2="15"/>
                </svg>
                Any Game
              </span>
            </label>
            <label class="checkbox">
              <input type="checkbox" value="Co-op / PvP" class="game-check" />
              <span>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:middle;margin-right:4px;">
                  <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
                  <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
                  <line x1="12" y1="22.08" x2="12" y2="12"/>
                </svg>
                Co-op / PvP
              </span>
            </label>
          </div>
        </div>

        <div class="form-group">
          <label for="bio">Bio (opsional)</label>
          <textarea
            id="bio"
            placeholder="Ceritain dikit tentang kamu..."
            maxlength="150"
            rows="3"
          ></textarea>
        </div>

        <button type="submit" class="btn btn-primary btn-full" id="registerBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:middle;margin-right:6px;">
            <path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/>
            <path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/>
            <path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/>
            <path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/>
          </svg>
          Daftar Sekarang
        </button>

        <p class="auth-error" id="authError" style="display:none;"></p>
      </form>

      <p class="auth-hint">
        *1 IP = 1 akun. Setelah daftar, kamu otomatis login selamanya.
      </p>
    </div>
  </section>

  <footer>
    <div class="footer-bottom">
      <p>© <span class="year"></span> Destroyer Community — Made with 
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="vertical-align:middle;color:#ff4444;">
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
      </p>
    </div>
  </footer>

  <script src="/public/js/config.js"></script>
  <script src="/public/js/main.js"></script>
  <script src="/public/js/register.js"></script>

</body>
</html>
